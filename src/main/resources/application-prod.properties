# MySQL
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

jwt.secret=${JWT_SECRET}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Database migrations run before Hibernate validates the production schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-migration-naming=true

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://partidoya-web-20232545.onrender.com,http://localhost:4200,http://127.0.0.1:4200}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.onrender.com,https://*.vercel.app,https://*.partidoya.pro}
